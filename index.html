7<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나랑결혼해줘🥰</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #fff0f5;
    font-family: sans-serif;
    text-align: center;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

button {
    padding: 12px 30px;
    margin: 10px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.yes {
    background: #ff4d6d;
    color: white;
}

.no {
    background: #ddd;
}
</style>
</head>
<body>

<div class="container">
    <h1 id="question">나랑 결혼해줄래?</h1>
    
    <div id="buttons">
        <button class="yes" onclick="accept()">예</button>
        <button class="no" onclick="forceAccept()">아니오</button>
    </div>

    <h2 id="result" style="display:none; color:#ff4d6d;">
    새해 복 많이 받으세요~
</div>

<script>
function forceAccept() {
    const buttons = document.querySelectorAll("button");
    
    buttons.forEach(btn => {
        btn.innerText = "예";
        btn.classList.remove("no");
        btn.classList.add("yes");
        btn.onclick = accept;
    });

    document.getElementById("question").innerText = 
        "나랑결혼해줄래?🥰🥰";
}

function accept() {
    document.getElementById("buttons").style.display = "none";
    document.getElementById("question").innerText = "YES ❤️";
    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
